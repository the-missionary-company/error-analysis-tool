<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Eval dashboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      form {
        width: min(360px, calc(100vw - 32px));
        padding: 24px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: #71717a;
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 15px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        background: #18181b;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      .error {
        color: #b91c1c;
        font-size: 13px;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/api/login">
      <h1>Eval dashboard</h1>
      <p>Shared password. This is a padlock, not a vault.</p>
      <p id="error" class="error" hidden>Wrong password.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Open</button>
    </form>
    <script>
      if (new URLSearchParams(location.search).get('error')) {
        document.getElementById('error').hidden = false;
      }
    </script>
  </body>
</html>
